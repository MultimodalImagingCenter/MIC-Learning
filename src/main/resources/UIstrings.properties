# --- Processing + Run Page ---
# Keys are structured as: run.[task_id].[model_id].[property]

# For Classification with RandomForest
run.classification.rf.title=Classification with Random Forest
run.classification.rf.content=processing/classification_rf.md
run.classification.rf.runnable=false

# For Classification with MLP
run.classification.mlp.title=Classification with MLP
run.classification.mlp.content=processing/classification_mlp.md
run.classification.mlp.runnable=true
run.classification.mlp.modelSubfolder=mlp-histo-cells
run.classification.mlp.exampleImage=sample_input.tif
run.classification.mlp.macroTemplate.default=run("Classification prediction", "model_directory={MODEL_PATH} properties_file_name=defaultServing.properties");
run.classification.mlp.macroTemplate.options=run("Classification prediction");


# For Classification with CNN
run.classification.cnn.title=Classification with CNN
run.classification.cnn.content=processing/classification_cnn.md
run.classification.cnn.runnable=false

# For semantic segmentation with Random Forest
run.semanticSegmentation.rf.title=Semantic Segmentation with WEKA
run.semanticSegmentation.rf.content=processing/semanticSegmentation_rf.md
run.semanticSegmentation.rf.runnable=false
run.semanticSegmentation.rf.modelSubfolder=weka_classifier
run.semanticSegmentation.rf.exampleImage=sample_input.tif
run.semanticSegmentation.rf.macroTemplate.default=\
  run("Trainable Weka Segmentation");\n\
  wait(500)\n\
  call("trainableSegmentation.Weka_Segmentation.loadClassifier", "{MODEL_PATH}/classifier.model");\n\
  wait(200)\n\
  call("trainableSegmentation.Weka_Segmentation.getResult");
run.semanticSegmentation.rf.macroTemplate.options=\
  run("Trainable Weka Segmentation");\n\
  wait(500)\n\
  call("trainableSegmentation.Weka_Segmentation.loadClassifier", "{MODEL_PATH}/classifier.model");

# For semantic segmentation with MLP
