[workspace]
channels = ["conda-forge"]
name = "SAM_muggled_env2"
platforms = ["linux-64", "win-64"]

[tasks]

[dependencies]
python = "3.12.*"
appose = "*"

[target.win-64.dependencies]
numpy = ">=1.26,<2"


[pypi-dependencies]
torch = { version = "==2.5.1", index = "https://download.pytorch.org/whl/cu124" }
muggled_sam = { git = "https://github.com/heyoeyo/muggled_sam.git"}